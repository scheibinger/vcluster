suite: Config Secret
templates:
  - config-secret.yaml

tests:
  - it: check defaults
    release:
      name: my-release
      namespace: my-namespace
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret
      - equal:
          path: metadata.name
          value: vc-config-my-release
      - equal:
          path: metadata.namespace
          value: my-namespace

  - it: should set global metadata labels
    set:
      controlPlane:
        advanced:
          globalMetadata:
            labels:
              my-label: my-value
    release:
      name: my-release
      namespace: my-namespace
    asserts:
      - equal:
          path: metadata.labels.my-label
          value: "my-value"

  - it: should set global metadata annotations
    set:
      controlPlane:
        advanced:
          globalMetadata:
            annotations:
              my-annotation: my-value
    release:
      name: my-release
      namespace: my-namespace
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.annotations["my-annotation"]
          value: "my-value"

